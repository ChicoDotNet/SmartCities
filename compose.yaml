name: smartcities-local

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartcities
      POSTGRES_USER: smartcities
      POSTGRES_PASSWORD: smartcities-dev-only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcities -d smartcities"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - smartcities-postgres:/var/lib/postgresql/data

volumes:
  smartcities-postgres:
