name: Product Web CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'src/SmartCities.Web/**'
      - '.node-version'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/SmartCities.Web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: src/SmartCities.Web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test product web client
        run: npm test
      - name: Build product web client
        run: npm run build
