name: Local Vertical Slice CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'src/SmartCities.Api/**'
      - 'src/SmartCities.Application/**'
      - 'src/SmartCities.Composition/**'
      - 'src/SmartCities.Infrastructure/**'
      - 'src/SmartCities.Infrastructure.PostgreSql/**'
      - 'scripts/verify-local-vertical-slice.py'
      - '.github/workflows/local-vertical-slice-ci.yml'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartcities
          POSTGRES_USER: smartcities
          POSTGRES_PASSWORD: smartcities-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcities -d smartcities"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SmartCities.slnx

      - name: Build
        run: dotnet build SmartCities.slnx --configuration Release --no-restore

      - name: Start API and verify PostgreSQL vertical slice
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5000
          SmartCities__Persistence__DbProvider: PostgreSql
          SmartCities__Persistence__ConnectionString: Host=127.0.0.1;Port=5432;Database=smartcities;Username=smartcities;Password=smartcities-ci-only
          SmartCities__Persistence__ApplyMigrationsOnStartup: 'true'
          SmartCities__Build__CommitSha: ${{ github.sha }}
          SmartCities__Build__BuildId: ${{ github.run_id }}
          SMARTCITIES_API_BASE_URL: http://127.0.0.1:5000
          SMARTCITIES_EXPECTED_COMMIT: ${{ github.sha }}
          SMARTCITIES_EXPECTED_BUILD_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          dotnet run             --project src/SmartCities.Api/SmartCities.Api.csproj             --configuration Release             --no-build             --no-launch-profile             > /tmp/smartcities-api.log 2>&1 &

          API_PID=$!
          trap 'status=$?; cat /tmp/smartcities-api.log; kill "$API_PID" 2>/dev/null || true; exit "$status"' EXIT

          python3 scripts/verify-local-vertical-slice.py
